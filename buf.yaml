# Buf workspace: lint + breaking-change detection for the wire contracts.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    # Every service, RPC, message and enum must be documented; fields and enum values are
    # documented where the name alone is not self-explanatory.
    - COMMENT_FIELD
    - COMMENT_ENUM_VALUE
    - COMMENT_ONEOF
    # Streaming RPCs share request/response envelope types by design.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  rpc_allow_google_protobuf_empty_requests: false
breaking:
  use:
    - WIRE_JSON
