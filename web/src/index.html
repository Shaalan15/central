<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Central</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!--
      The Central server replaces __CSP_NONCE__ with a fresh per-request nonce and sends a
      matching `style-src 'nonce-…'` Content-Security-Policy header. Angular applies the nonce
      to every <style> element it creates, so no 'unsafe-inline' is ever needed.
    -->
    <app-root ngCspNonce="__CSP_NONCE__"></app-root>
    <noscript>Central requires JavaScript.</noscript>
  </body>
</html>
